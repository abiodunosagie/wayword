name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, tests and Expo doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npx expo-doctor

  edge-function:
    name: Edge function check, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/wayword
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.x
      - run: deno check index.ts
      - run: deno lint
      - run: deno fmt --check
      - run: deno test
